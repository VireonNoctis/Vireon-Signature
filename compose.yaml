services:
  signature:
    build:
      context: .
      dockerfile: Dockerfile
    image: vireon-signature:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      WEB_ROOT: /app/web
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - signature-data:/data

volumes:
  signature-data:
