name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate frontend, C++ API and email rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install C++ and RocksDB dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential librocksdb-dev libboost-system-dev libssl-dev nlohmann-json3-dev

      - name: Validate repository configuration
        run: python3 scripts/validate.py

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Run domain and team tests
        run: npm test

      - name: Build and test C++ RocksDB API
        run: npm run test:backend
        timeout-minutes: 5

      - name: Build frontend
        run: npm run build

      - name: Run email-client regression matrix
        run: npm run test:email
        timeout-minutes: 15

      - name: Upload email preview screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: email-client-previews-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
